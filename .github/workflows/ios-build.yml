name: iOS build (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - app_test

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install -D @capacitor/cli @capacitor/core @capacitor/ios

      - name: Prepare Capacitor iOS project
        shell: bash
        run: |
          set -euo pipefail
          # Add iOS platform only if not already present
          if [[ ! -d "ios" ]]; then
            npx cap add ios
          fi
          npx cap copy ios

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          sudo gem install cocoapods -n /usr/local/bin || true
          cd ios/App
          pod install --repo-update

      - name: Build with xcodebuild
        shell: bash
        run: |
          set -euo pipefail
          cd ios/App
          if [[ -d "App.xcworkspace" ]]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build
          fi


