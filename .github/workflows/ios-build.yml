name: iOS build (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - app_test

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install -D @capacitor/cli @capacitor/core

      - name: Create Capacitor iOS project
        run: |
          npx cap init PiXiEEDraw com.pixieedlabo.app --web-dir . --skip-dependencies
          npx cap add ios
          npx cap copy

      - name: Build with xcodebuild
        run: |
          cd ios/App
          xcodebuild -scheme App -sdk iphonesimulator -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 15' build


